<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Capsule Podcasts</title>

		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<style lang="scss">
			@font-face {
				font-family: 'Cabin';
				src: url('%sveltekit.assets%/fonts/Cabin.woff2') format('woff2');
			}

			html,
			body {
				font-family: 'Cabin', sans-serif;
				width: 100%;
				height: 100%;
				margin: 0;
				padding: 0;

				/* TODO: set via tailwind */
				background-color: #fcfcfc;

				color: #30374b;

				/* 
					Disable `Pull to Refresh` capabilities.
					See: 
						https://developer.mozilla.org/en-US/docs/Web/CSS/overscroll-behavior-y
						https://web.dev/learn/pwa/app-design#pull_to_refresh
				*/
				overscroll-behavior-y: contain;
			}

			button {
				cursor: pointer;
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
